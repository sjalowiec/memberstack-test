# Temporary pre-launch: block search indexing site-wide (see src/components/seo/RobotsMeta.astro).
# At launch: remove PUBLIC_NOINDEX (or set "false") and redeploy.
[build.environment]
  PUBLIC_NOINDEX = "true"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Basic-Auth = "admin:knit741"

# Local dev: proxy to Astro (port 4321) and run functions in one process.
# Prefer `netlify dev` over running `netlify dev --framework=#static` beside `npm run dev`.
[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#custom"
  autoLaunch = false

[dev.environment]
  ALLOW_DEV_PATTERN_USER = "true"
  # Reduce Windows EPERM failures from chokidar on `.netlify/functions-serve`
  CHOKIDAR_USEPOLLING = "true"

# Watson live Shopify order sync (every 6 hours). Requires WATSON_DATABASE_URL +
# SHOPIFY_* env vars in the Netlify site. Manual sync: POST /api/watson/shopify/sync
[functions."watson-shopify-sync"]
  schedule = "0 */6 * * *"

# Legacy annual membership expiration reconciliation (daily at 09:00 UTC, safely
# after midnight in America/Los_Angeles). Removes the free legacy membership plan
# from Memberstack members whose Watson paid-through date has passed. Scheduled
# runs perform LIVE changes ONLY when LEGACY_ANNUAL_EXPIRY_LIVE_ENABLED === "true";
# otherwise they run dry-run. Manual HTTP is dry-run by default; a live manual run
# requires POST ?confirm=LIVE AND a correct X-Legacy-Expiry-Secret header.
# Requires WATSON_DATABASE_URL + MEMBERSTACK_SECRET_KEY.
[functions."legacy-annual-expiry"]
  schedule = "0 9 * * *"

# Legacy annual renewal reminders (daily at 08:00 UTC, ~midnight America/Los_Angeles).
# Tags legacy annual members in ActiveCampaign at 30 / 7 / 1 day before their Watson
# paid-through date, after re-checking Memberstack for an active paid plan. Scheduled
# runs perform LIVE changes ONLY when LEGACY_RENEWAL_REMINDER_LIVE_ENABLED === "true";
# otherwise they run dry-run. Manual HTTP is dry-run by default; a live manual run
# requires POST ?confirm=LIVE AND a correct X-Legacy-Renewal-Secret header. Never
# modifies Watson dates. Requires WATSON_DATABASE_URL + MEMBERSTACK_SECRET_KEY +
# ACTIVECAMPAIGN_* (API key, base url, KIN list id, paid-through field id).
[functions."legacy-renewal-reminders"]
  schedule = "0 8 * * *"

# Taitexma ribber slug cleanup (misnamed TR-860 / broken Silver Reed link).
[[redirects]]
  from = "/shop/machines/taitexma-tr-860"
  to = "/shop/machines/taitexma-tr-850"
  status = 301

[[redirects]]
  from = "/shop/machines/silver-reed-tr-860"
  to = "/shop/machines/taitexma-tr-850"
  status = 301

# Community excluded from launch — do not serve Talkyard community UI.
[[redirects]]
  from = "/community"
  to = "/membership"
  status = 301

[[redirects]]
  from = "/community-intro-old"
  to = "/membership"
  status = 301

# Canonical troubleshooting guide lives at /troubleshoot.
[[redirects]]
  from = "/its-not-you-might-be-your-machine"
  to = "/troubleshoot"
  status = 301

# Individual Hybrid Blanket pattern sale retired — Dynamic Patterns are membership-only.
[[redirects]]
  from = "/patterns/hybrid-blanket/sales"
  to = "/patterns/about"
  status = 301
