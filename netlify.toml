# Temporary pre-launch: block search indexing site-wide (see src/components/seo/RobotsMeta.astro).
# At launch: remove PUBLIC_NOINDEX (or set "false") and redeploy.
[build.environment]
  PUBLIC_NOINDEX = "true"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Basic-Auth = "admin:knit741"

# Local dev: proxy to Astro (port 4321) and run functions in one process.
# Prefer `netlify dev` over running `netlify dev --framework=#static` beside `npm run dev`.
[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  framework = "#custom"
  autoLaunch = false

[dev.environment]
  ALLOW_DEV_PATTERN_USER = "true"
  # Reduce Windows EPERM failures from chokidar on `.netlify/functions-serve`
  CHOKIDAR_USEPOLLING = "true"

# Taitexma ribber slug cleanup (misnamed TR-860 / broken Silver Reed link).
[[redirects]]
  from = "/shop/machines/taitexma-tr-860"
  to = "/shop/machines/taitexma-tr-850"
  status = 301

[[redirects]]
  from = "/shop/machines/silver-reed-tr-860"
  to = "/shop/machines/taitexma-tr-850"
  status = 301